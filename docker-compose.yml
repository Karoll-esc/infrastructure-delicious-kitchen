services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================
  
  mongodb:
    image: mongo:latest
    container_name: restaurant-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: orders
    volumes:
      - mongodb_data:/data/db
    networks:
      - delicious-kitchen-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: restaurant-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - delicious-kitchen-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo-express:
    image: mongo-express:latest
    container_name: restaurant-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - delicious-kitchen-network

  # ==========================================
  # MICROSERVICES
  # ==========================================

  api-gateway:
    build: ../api-gateway-delicious-kitchen
    container_name: delicious-api-gateway
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_GATEWAY_PORT}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      KITCHEN_SERVICE_URL: ${KITCHEN_SERVICE_URL}
      CORS_ENABLED: ${CORS_ENABLED}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    depends_on:
      - order-service
      - kitchen-service
    networks:
      - delicious-kitchen-network
    restart: unless-stopped

  order-service:
    build: ../order-service-delicious-kitchen
    container_name: delicious-order-service
    env_file:
      - .env
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ORDER_SERVICE_PORT}
      MONGODB_URL: ${ORDER_MONGODB_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - delicious-kitchen-network
    restart: unless-stopped

  kitchen-service:
    build: ../kitchen-service-delicious-kitchen 
    container_name: delicious-kitchen-service
    env_file:
      - .env
    ports:
      - "${KITCHEN_SERVICE_PORT}:${KITCHEN_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${KITCHEN_SERVICE_PORT}
      MONGODB_URL: ${KITCHEN_MONGODB_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - delicious-kitchen-network
    restart: unless-stopped

  notification-service:
    build: ../notification-service-delicious-kitchen
    container_name: delicious-notification-service
    env_file:
      - .env
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${NOTIFICATION_SERVICE_PORT}
      RABBITMQ_URL: ${RABBITMQ_URL}
      # ==========================================
      # SMTP Configuration for Email Notifications
      # ==========================================
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # ==========================================
      # Frontend URL for email links
      # ==========================================
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - delicious-kitchen-network
    restart: unless-stopped

  frontend:
    build: ../frontend-delicious-kitchen
    container_name: delicious-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:${API_GATEWAY_PORT}
      VITE_NOTIFICATION_URL: ${VITE_NOTIFICATION_URL}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    depends_on:
      - api-gateway
    networks:
      - delicious-kitchen-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  delicious-kitchen-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data: